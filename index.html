tarea{border:1px solid #cbdde9;border-radius:9px;padding:10px;max-width:100%;background:white;color:#16354e}.field textarea{min-height:85px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:11px;border-bottom:1px solid #e7eef5;text-align:right}th{background:#f1f7fc;color:#315c7d}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#eaf4ff;padding:8px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}.notice{padding:13px;background:#fff5d9;border:1px solid #f2dc9e;border-radius:12px;color:#765619;margin:12px 0}.success{background:#e6f9ef;color:#15713f}.danger{background:#ffe9ec;color:#b92e3e}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.line{height:1px;background:#e4edf4;margin:15px 0}.bar{height:12px;border-radius:20px;background:#e4ebf3;overflow:hidden}.bar i{display:block;height:100%;background:#ffbd28}.mini{font-size:12px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.tab{border:1px solid #d3e3f0;background:#fff;border-radius:10px;padding:9px 12px;color:#21547b}.tab.on{background:#0877d3;color:#fff}.product{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid #e0ebf3;border-radius:11px;padding:12px;margin:8px 0}.counter{display:flex;align-items:center;gap:6px}.counter button{border:0;background:#e5f3ff;color:#0867b7;border-radius:7px;padding:6px 10px}.counter strong{min-width:24px;text-align:center}.hidden{display:none!important}.mobiletop{display:none}.login{max-width:440px;margin:9vh auto;background:white;border:1px solid #dce8f2;border-radius:20px;padding:28px;box-shadow:0 15px 55px #153c6522}.login h1{color:#0b5ca2}.tag{font-size:12px;border-radius:8px;padding:4px 8px;background:#e8f6ec;color:#087942}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi>div{border:1px solid #dce8f2;border-radius:12px;padding:12px}.kpi b{display:block;font-size:21px;color:#086cb8}.foot{font-size:12px;color:#728ba2;margin-top:25px}.checkboxes{display:flex;gap:10px;flex-wrap:wrap}.checkboxes label{border:1px solid #dce7ef;border-radius:9px;padding:9px;background:#fafcff}.empty{padding:20px;color:#8094a6;text-align:center}.layout-title{font-weight:bold;color:#0d5996}.printonly{display:none}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{width:100%;height:auto;position:relative;padding:10px}.side .navlist{display:flex;overflow:auto;gap:3px}.nav{white-space:nowrap;width:auto;font-size:12px}.main{padding:12px}.head h1{font-size:20px}.grid,.fields{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.product{grid-template-columns:1fr auto}.product .price{grid-column:1/-1}.mobiletop{display:block}}@media print{.side,.actions,.btn,.tabs,.foot{display:none!important}.main{padding:0}.panel,.card{box-shadow:none}}
</style></head><body><div id="root"></div><script>
'use strict';
const TODAY=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const USERS=[{name:'علي موفق',role:'admin'},{name:'د. علي الدليمي',role:'admin'},{name:'حمزة البغدادي',role:'supervisor'},{name:'د. محمد الماجد',role:'supervisor'},{name:'علي سعدي',role:'rep'},{name:'مهند شهيد',role:'rep'},{name:'محمد قاسم',role:'rep'},{name:'محمد قحطان',role:'rep'},{name:'علي أحمد',role:'rep'},{name:'أحمد محمد',role:'rep'},{name:'حيدر علي',role:'rep'},{name:'زائر عرض فقط',role:'guest'},{name:'زائر مدير تجريبي',role:'demo_admin'}];
const REPS=['علي موفق','علي سعدي','علي أحمد','أحمد محمد','محمد قاسم','محمد قحطان','مهند شهيد','حيدر علي'];
const SUPPLIERS=['فصول','المنتج الأخضر','المنى','الشرق','المدينة','الفرات','الرافدين','الطالبية','ندى الرافدين'];
const PRODUCTS=[{company:'أفالون',name:'Avocom Spray',price:8422,desc:'بخاخ أنفي'},{company:'أفالون',name:'Broncast 5 mg',price:8201,desc:'أقراص'},{company:'أفالون',name:'Broncast 10 mg',price:8272,desc:'أقراص'},{company:'أفالون',name:'Cortrief',price:8820,desc:'مستحضر دوائي'},{company:'أفالون',name:'Salinose Cold Defence',price:9240,desc:'بخاخ أنفي'},{company:'أفالون',name:'Salinose Nasal 30',price:8400,desc:'بخاخ أنفي'},{company:'أفالون',name:'Salinose Plus 20',price:9075,desc:'بخاخ أنفي'},{company:'أفالون',name:'Salinose Plus 75',price:12096,desc:'بخاخ أنفي'},{company:'أفالون',name:'Salinose Hypertonic 75',price:12096,desc:'بخاخ أنفي'},{company:'أفالون',name:'Zencin 500',price:3889,desc:'أقراص'},{company:'أفالون',name:'Tavflox 500',price:5553,desc:'أقراص'}];
const KEY='safeer360_ui_preview_v1';let state={users:USERS.map((u,i)=>({...u,id:'u'+i,active:true,phone:''})),suppliers:SUPPLIERS.slice(),products:PRODUCTS.slice(),visits:[],orders:[],messages:[],offers:[],bonuses:[{company:'أفالون',product:'Zencin 500',min:20,percent:10},{company:'أفالون',product:'Zencin 500',min:50,percent:40},{company:'أفالون',product:'Zencin 500',min:100,percent:80}],supplierRequests:[],settings:{visitGoal:10}};
try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&Array.isArray(stored.users))state={...state,...stored}}catch(e){}
let current=null,view='home',draft={qty:{},suppliers:[],results:[]},filter={};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const $=x=>document.getElementById(x);const value=x=>$(x)?.value?.trim()||'';const isAdmin=()=>['admin','demo_admin'].includes(current?.role),isSupervisor=()=>current?.role==='supervisor',canManage=()=>isAdmin()||isSupervisor(),isRep=()=>current?.role==='rep';const isGuest=()=>current?.role==='guest';const canEdit=()=>!['guest','demo_admin'].includes(current?.role);const mine=arr=>canManage()?arr:arr.filter(x=>x.rep===current?.name);const isDemo=()=>current?.role==='demo_admin';const readOnly=()=>isGuest()||isDemo();const setView=v=>{view=v;draft={qty:{},suppliers:[],results:[]};render()};
const titleRole=r=>({admin:'مدير النظام',supervisor:'سوبرفايزر',rep:'مندوب تجاري',guest:'زائر للعرض',demo_admin:'زائر بصلاحيات مدير - تجريبي'})[r]||r;
function loginScreen(){ $('root').innerHTML=`<section class="login"><div class="logo" style="color:#0866b7">SAFEER <span>ALDAWAA 360</span><small>معاً لصحة أفضل</small></div><h1>نسخة الواجهات الشاملة</h1><p class="notice">هذه بيئة عرض محلية لا تستخدم حسابات حقيقية أو بيانات Firebase. اختيار الحساب هنا لتجربة الواجهات فقط وليس تسجيل دخول آمناً.</p><div class="field"><label>اختر الواجهة للتجربة</label><select id="demoRole">${state.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} — ${titleRole(u.role)}</option>`).join('')}</select></div><div class="actions"><button class="btn" onclick="enterDemo()">الدخول إلى المعاينة</button></div><p class="muted">لا ترفع بيانات حقيقية أو أرقام PIN إلى هذه النسخة.</p></section>`}
function enterDemo(){current=state.users.find(u=>u.id===value('demoRole'));if(!current?.active){alert('الحساب موقوف');return}setView('home')}
const navFor=()=>canManage()?[['home','الرئيسية'],['reps','إدارة المندوبين'],['visits','الزيارات اليومية'],['orders','الطلبات'],['reports','التقارير'],['products','الشركات والمواد'],['offers','العروض والبونص'],['suppliers','المذاخر'],['messages','المتابعة والدعم'],['users','إدارة المستخدمين']]:[['home','الرئيسية'],['visits','الزيارات اليومية'],['orders','الطلبات'],['offers','العروض والبونص'],['messages','المتابعة والدعم'],['evaluation','تقييمي']];
function shell(){ $('root').innerHTML=`<div class="app"><aside class="side"><div class="logo">◉ SAFEER <span>360</span><small>معاً لصحة أفضل</small></div><p class="mini">${esc(current.name)}<br>${titleRole(current.role)}</p><div class="navlist">${navFor().map(([k,t])=>`<button class="nav ${view===k?'on':''}" onclick="setView('${k}')">${t}</button>`).join('')}<button class="nav" onclick="current=null;loginScreen()">تبديل الحساب</button></div></aside><main class="main"><header class="head"><div><h1>${esc(navFor().find(n=>n[0]===view)?.[1]||'SAFEER 360')}</h1><div class="muted">${esc(current.name)} · ${titleRole(current.role)} · ${TODAY()}</div></div><span class="pill">نسخة معاينة محلية • غير متصلة بالخادم</span></header><div id="content"></div><div class="foot">SAFEER ALDAWAA 360 · نموذج شامل للواجهات والعمليات المحلية، وليس إصداراً إنتاجياً.</div></main></div>`;const pages={home,visits,orders,reports,products,offers,suppliers,messages,evaluation,reps,users};$('content').innerHTML=(pages[view]||home)()}
function render(){if(!current)loginScreen();else shell()}
const cards=items=>`<div class="cards">${items.map(([t,n])=>`<div class="card"><div class="muted">${t}</div><div class="num">${n}</div></div>`).join('')}</div>`;
const todayVisits=()=>mine(state.visits).filter(v=>v.date===TODAY());const todayOrders=()=>mine(state.orders).filter(o=>o.date===TODAY());const confirmed=o=>['success','partial'].includes(o.status);const sales=os=>os.filter(confirmed).reduce((s,o)=>s+(o.confirmedTotal||0),0);
function home(){const v=todayVisits(),o=todayOrders(),col=v.reduce((s,x)=>s+Number(x.collection||0),0);let result=cards([['المندوبون النشطون',state.users.filter(x=>x.role==='rep'&&x.active).length],['زيارات اليوم',v.length],['طلبات اليوم',o.length],['المبيعات المؤكدة',money(sales(o))]]);result+=`<div class="grid"><section class="panel"><h2>ملخص اليوم</h2><div class="kpi"><div>الزيارات<b>${v.length}</b></div><div>الطلبات<b>${o.length}</b></div><div>الاستحصال<b>${money(col)}</b></div><div>الهدف اليومي<b>${state.settings.visitGoal}</b></div></div><div class="line"></div><div>معدل الزيارات: ${v.length} من ${state.settings.visitGoal}</div><div class="bar"><i style="width:${Math.min(100,v.length/state.settings.visitGoal*100)}%"></i></div></section><section class="panel"><h2>آخر الأنشطة</h2>${[...v.map(x=>({text:`زيارة: ${x.customer} — ${x.rep}`,date:x.date})),...o.map(x=>({text:`طلب: ${x.pharmacy} — ${x.rep}`,date:x.date}))].slice(-7).reverse().map(x=>`<p>• ${esc(x.text)}</p>`).join('')||'<div class="empty">لا توجد أنشطة مسجلة اليوم</div>'}</section></div>`;if(canManage())result+=`<section class="panel"><h2>المندوبون — ملخص الأداء</h2>${repTable()}</section>`;else result+=`<section class="panel"><h2>التقييم والتوجيه اليومي</h2>${evaluationBody()}</section>`;return result}
function repTable(){return `<div class="tablewrap"><table><thead><tr><th>المندوب</th><th>زيارات اليوم</th><th>الطلبات</th><th>المبيعات المؤكدة</th><th>الاستحصال</th></tr></thead><tbody>${REPS.map(rep=>{const v=state.visits.filter(x=>x.rep===rep&&x.date===TODAY()),o=state.orders.filter(x=>x.rep===rep&&x.date===TODAY());return `<tr><td>${rep}</td><td>${v.length}</td><td>${o.length}</td><td>${money(sales(o))}</td><td>${money(v.reduce((s,x)=>s+Number(x.collection||0),0))}</td></tr>`}).join('')}</tbody></table></div>`}
function visitForm(){return `<section class="panel"><h2>زيارة جديدة</h2><div class="fields"><div class="field"><label>المندوب</label><input value="${esc(current.name)}" disabled></div><div class="field"><label>التاريخ</label><input value="${TODAY()}" disabled></div><div class="field"><label>المنطقة *</label><input id="vArea" placeholder="مثلاً المنصور"></div><div class="field"><label>اسم الجهة / الزبون *</label><input id="vCustomer" placeholder="اسم الصيدلية أو الطبيب"></div><div class="wide"><b>نوع الجهة (يمكن اختيار أكثر من نوع)</b><div class="checkboxes">${['صيدلية','مذخر','طبيب','مستشفى','عيادة تمريض'].map(t=>`<label><input type="checkbox" name="vType" value="${t}"> ${t}</label>`).join('')}</div></div><div class="wide"><b>نتيجة الزيارة (يمكن اختيار أكثر من نتيجة)</b><div class="checkboxes">${['ترويج','متابعة','استحصال','تسليم بونص','أوردر','المالك غير موجود','موعد استحصال','إعادة زيارة','سحب مواد','ملاحظات'].map(t=>`<label><input type="checkbox" name="vResult" value="${t}" onchange="toggleVisitFields()"> ${t}</label>`).join('')}</div></div><div class="field hidden" id="vCollectWrap"><label>مبلغ الاستحصال *</label><input type="number" id="vCollection" min="0"><label>رقم القائمة</label><input id="vInvoice"></div><div class="field hidden" id="vCompanyWrap"><label>شركة الأوردر *</label><select id="vCompany"><option value="">اختر الشركة</option>${companies().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field hidden" id="vBonusWrap"><label>مادة البونص</label><input id="vBonusItem"><label>الكمية</label><input type="number" id="vBonusQty" min="0"></div><div class="field hidden" id="vDateWrap"><label>تاريخ المتابعة / الموعد</label><input type="date" id="vFollowup"></div><div class="field wide"><label>ملاحظات / سبب سحب المواد</label><textarea id="vNotes"></textarea></div></div><div class="actions"><button class="btn" onclick="saveVisit()">حفظ الزيارة</button></div></section>`}
function checked(n){return [...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value)}function toggleVisitFields(){const r=checked('vResult');$('vCollectWrap').classList.toggle('hidden',!r.includes('استحصال'));$('vCompanyWrap').classList.toggle('hidden',!r.includes('أوردر'));$('vBonusWrap').classList.toggle('hidden',!r.includes('تسليم بونص'));$('vDateWrap').classList.toggle('hidden',!r.some(x=>['موعد استحصال','إعادة زيارة','المالك غير موجود'].includes(x)))}
function saveVisit(){if(readOnly())return alert('الحساب للعرض فقط');const area=value('vArea'),customer=value('vCustomer'),types=checked('vType'),results=checked('vResult');if(!area||!customer||!types.length||!results.length)return alert('أكمل المنطقة والجهة ونوعها ونتيجة الزيارة');if(results.includes('استحصال')&&!(Number(value('vCollection'))>0))return alert('مبلغ الاستحصال إلزامي');if(results.includes('أوردر')&&!value('vCompany'))return alert('اختيار شركة الأوردر إلزامي');state.visits.push({id:id(),date:TODAY(),rep:current.name,area,customer,types,results,collection:Number(value('vCollection'))||0,invoice:value('vInvoice'),company:value('vCompany'),bonusItem:value('vBonusItem'),bonusQty:value('vBonusQty'),followup:value('vFollowup'),notes:value('vNotes')});save();alert('تم حفظ الزيارة محلياً');setView('visits')}
function visits(){return `${!canManage()&&!readOnly()?`<div class="actions"><button class="btn" onclick="$('visitForm').classList.toggle('hidden')">+ زيارة جديدة</button></div><div id="visitForm" class="hidden">${visitForm()}</div>`:''}<section class="panel"><h2>${canManage()?'إدارة الزيارات':'زياراتي'}</h2><div class="actions"><input id="vSearch" placeholder="بحث بالاسم أو المنطقة" oninput="drawVisitRows()"><input id="vFrom" type="date" onchange="drawVisitRows()"><input id="vTo" type="date" onchange="drawVisitRows()">${canManage()?`<select id="vRep" onchange="drawVisitRows()"><option value="">جميع المندوبين</option>${REPS.map(x=>`<option>${x}</option>`).join('')}</select>`:''}<button class="btn alt" onclick="exportRows('visits')">تصدير CSV</button></div><div id="visitRows"></div></section>`}
function drawVisitRows(){let arr=mine(state.visits).slice().reverse().filter(x=>(!value('vSearch')||[x.customer,x.area].join(' ').includes(value('vSearch')))&&(!value('vRep')||x.rep===value('vRep'))&&(!value('vFrom')||x.date>=value('vFrom'))&&(!value('vTo')||x.date<=value('vTo')));$('visitRows').innerHTML=table(['التاريخ','المندوب','الجهة','المنطقة','النتائج','استحصال','المتابعة'],arr.map(x=>[x.date,x.rep,x.customer,x.area,x.results.join(' + '),money(x.collection),x.followup||'—']))}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">لا توجد بيانات مطابقة</div>'}`}
const companies=()=>[...new Set(state.products.map(p=>p.company))];
function orderForm(){return `<section class="panel"><h2>طلبية جديدة</h2><div class="fields"><div class="field"><label>اسم الصيدلية *</label><input id="oPharmacy"></div><div class="field"><label>المنطقة *</label><input id="oArea"></div><div class="field"><label>اسم الطبيب (اختياري)</label><input id="oDoctor"></div><div class="field"><label>جهة التجهيز *</label><select id="oMode" onchange="modeOrder()"><option value="">اختر</option><option value="supplier">مذخر</option><option value="office_cash">مكتب — كاش</option><option value="office_credit">مكتب — آجل</option></select></div><div class="wide hidden" id="supplierBox"><b>اختر مذخراً أو أكثر</b><div class="checkboxes">${state.suppliers.map(s=>`<label><input type="checkbox" name="oSupplier" value="${esc(s)}"> ${esc(s)}</label>`).join('')}</div></div></div><div class="line"></div><h2>المواد والأسعار</h2><div class="notice">الأسعار هنا من بيانات النسخة التجريبية، ويجب تدقيقها واعتمادها من الإدارة قبل النشر الفعلي. مواد دبي غير مستوردة لعدم توفر الكتالوج في هذا الملف.</div>${companies().map(c=>`<h3>${esc(c)}</h3>${state.products.map((p,i)=>p.company===c?`<div class="product"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.desc)} · ${esc(p.company)}</div></div><div class="price">${money(p.price)}</div><div class="counter"><button onclick="qty(${i},-1)">−</button><strong id="q${i}">${draft.qty[i]||0}</strong><button onclick="qty(${i},1)">+</button></div></div>`:'').join('')}`).join('')}<div class="panel"><h2>إجمالي الطلب <span id="orderTotal">${money(0)}</span></h2><div class="actions"><button class="btn" onclick="saveOrder()">إتمام وحفظ الطلب</button><button class="btn alt" onclick="whatsappDraft(true)">واتساب مفصل</button><button class="btn alt" onclick="whatsappDraft(false)">واتساب مواد وأعداد</button></div></div></section>`}
function modeOrder(){$('supplierBox').classList.toggle('hidden',value('oMode')!=='supplier')}function qty(i,d){draft.qty[i]=Math.max(0,(draft.qty[i]||0)+d);$('q'+i).textContent=draft.qty[i];$('orderTotal').textContent=money(totalDraft())}function totalDraft(){return state.products.reduce((s,p,i)=>s+(draft.qty[i]||0)*p.price,0)}function orderData(){const pharmacy=value('oPharmacy'),area=value('oArea'),mode=value('oMode'),suppliers=checked('oSupplier'),items=state.products.map((p,i)=>({...p,qty:draft.qty[i]||0})).filter(x=>x.qty>0);if(!pharmacy||!area||!mode||mode==='supplier'&&!suppliers.length||!items.length){alert('أكمل الصيدلية والمنطقة وجهة التجهيز والمواد');return null}return {id:id(),date:TODAY(),rep:current.name,pharmacy,area,doctor:value('oDoctor'),mode,suppliers,items,total:totalDraft(),confirmedTotal:0,status:'pending',notes:''}}
function saveOrder(){if(readOnly())return alert('الحساب للعرض فقط');const o=orderData();if(!o)return;state.orders.push(o);save();alert('تم حفظ الطلب محلياً بحالة قيد الانتظار');setView('orders')}
function whatsappDraft(full){const o=orderData();if(!o)return;const text=['طلبية SAFEER 360',`الصيدلية: ${o.pharmacy}`,`المنطقة: ${o.area}`,`جهة التجهيز: ${o.mode==='supplier'?o.suppliers.join('، '):o.mode}`, ...o.items.map(p=>`${p.name} × ${p.qty}${full?' — '+money(p.price*p.qty):''}`),...(full?[`الإجمالي: ${money(o.total)}`]:[])].join('\n');window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}
function orders(){return `${!canManage()&&!readOnly()?`<div class="actions"><button class="btn" onclick="$('orderForm').classList.toggle('hidden')">+ طلبية جديدة</button></div><div id="orderForm" class="hidden">${orderForm()}</div>`:''}<section class="panel"><h2>الطلبات وحالات التجهيز</h2><div class="actions"><select id="oStatus" onchange="drawOrders()"><option value="">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="success">تم التجهيز بنجاح</option><option value="partial">مجهز جزئياً</option><option value="shortage">نقص مادة</option><option value="refused">لا يجهز</option></select>${canManage()?`<select id="oRep" onchange="drawOrders()"><option value="">جميع المندوبين</option>${REPS.map(x=>`<option>${x}</option>`).join('')}</select>`:''}<button class="btn alt" onclick="exportRows('orders')">تصدير CSV</button></div><div id="ordersList"></div></section>`}
const statusLabel=s=>({pending:'قيد الانتظار',success:'تم التجهيز بنجاح',partial:'مجهز جزئياً',shortage:'نقص مادة',refused:'لا يجهز'})[s]||s;
function drawOrders(){const list=mine(state.orders).slice().reverse().filter(x=>(!value('oStatus')||x.status===value('oStatus'))&&(!value('oRep')||x.rep===value('oRep')));$('ordersList').innerHTML=list.map(o=>`<section class="panel"><b>${esc(o.pharmacy)}</b> <span class="tag">${statusLabel(o.status)}</span><div class="muted">${esc(o.rep)} · ${o.date} · ${esc(o.area)} · ${esc(o.suppliers.join('، ')||o.mode)}</div><div class="mini">${o.items.map(p=>`${esc(p.name)} × ${p.qty}`).join('، ')}</div><p>قيمة الطلب: ${money(o.total)} | المبيعات المؤكدة: ${money(o.confirmedTotal)}</p>${o.notes?`<p class="muted">${esc(o.notes)}</p>`:''}${!readOnly()?`<div class="actions"><button class="btn alt sm" onclick="editOrderStatus('${o.id}')">تحديث حالة التجهيز</button></div>`:''}</section>`).join('')||'<div class="empty">لا توجد طلبات</div>'}
function editOrderStatus(oid){if(readOnly())return;const o=state.orders.find(x=>x.id===oid);if(!o)return;const s=prompt('الحالة: pending / success / partial / shortage / refused',o.status);if(!['pending','success','partial','shortage','refused'].includes(s))return alert('حالة غير صحيحة');let confirmed=0;if(s==='success')confirmed=o.total;if(s==='partial'){confirmed=Number(prompt('أدخل القيمة المؤكدة للأصناف المجهزة فقط (د.ع)',o.confirmedTotal||0));if(!Number.isFinite(confirmed)||confirmed<0||confirmed>o.total)return alert('قيمة غير صحيحة')}const notes=['partial','shortage','refused'].includes(s)?prompt('ملاحظات / المواد الناقصة / سبب عدم التجهيز',o.notes||''):o.notes;if(notes===null)return;o.status=s;o.confirmedTotal=confirmed;o.notes=notes;save();drawOrders()}
function reports(){const arr=mine(state.orders),v=mine(state.visits);return `${cards([['إجمالي الزيارات',v.length],['إجمالي الطلبات',arr.length],['المبيعات المؤكدة',money(sales(arr))],['إجمالي الاستحصال',money(v.reduce((s,x)=>s+Number(x.collection||0),0))]])}<section class="panel"><h2>التقارير الإدارية</h2><div class="actions"><button class="btn" onclick="exportRows('visits')">تصدير الزيارات CSV</button><button class="btn alt" onclick="exportRows('orders')">تصدير الطلبات CSV</button><button class="btn alt" onclick="window.print()">طباعة / حفظ PDF</button></div><div class="notice">مؤشر KPI الأسبوعي (60% قيمة / 40% عدد) مؤجل حسب الاتفاق، لذلك لا يتم حسابه هنا.</div></section><section class="panel"><h2>حسب المندوب</h2>${repTable()}</section>`}
function exportRows(type){const arr=type==='visits'?mine(state.visits):mine(state.orders);const cols=type==='visits'?['date','rep','customer','area','collection','results','notes']:['date','rep','pharmacy','area','total','confirmedTotal','status','notes'];const csv='\ufeff'+[cols.join(','),...arr.map(o=>cols.map(k=>'"'+String(Array.isArray(o[k])?o[k].join(' + '):o[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SAFEER_'+type+'_'+TODAY()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function products(){if(!canManage())return '<div class="notice">لا تملك صلاحية إدارة المواد</div>';return `<section class="panel"><h2>إدارة الشركات والمواد والأسعار</h2><div class="notice">الأسعار الموجودة مستوردة من نموذج قديم ولا تمثل قائمة أسعار معتمدة. لم يتم استيراد كتالوج دبي.</div>${!readOnly()?`<div class="fields"><div class="field"><label>الشركة</label><input id="pCompany" placeholder="أفالون / دبي"></div><div class="field"><label>اسم المادة</label><input id="pName"></div><div class="field"><label>سعر الوحدة</label><input id="pPrice" type="number" min="0"></div><div class="field"><label>وصف مختصر</label><input id="pDesc" maxlength="80"></div></div><div class="actions"><button class="btn" onclick="addProduct()">إضافة مادة</button></div>`:''}${table(['الشركة','المادة','السعر','الوصف'],state.products.map(p=>[p.company,p.name,money(p.price),p.desc]))}</section>`}
function addProduct(){if(!canManage()||readOnly())return;const company=value('pCompany'),name=value('pName'),price=Number(value('pPrice'));if(!company||!name||!Number.isFinite(price)||price<=0)return alert('أكمل بيانات المادة');state.products.push({company,name,price,desc:value('pDesc')});save();render()}
function offers(){return `<div class="grid"><section class="panel"><h2>شنو عدنا عروض اليوم؟</h2>${state.offers.map(o=>`<div class="chip">${esc(o.company)} — ${esc(o.title)}</div>`).join('')||'<div class="empty">لا توجد عروض مسجلة</div>'}${canManage()&&!readOnly()?`<div class="line"></div><div class="field"><label>الشركة</label><input id="offerCompany"></div><div class="field"><label>العرض</label><input id="offerTitle"></div><button class="btn" onclick="addOffer()">إضافة عرض</button>`:''}</section><section class="panel"><h2>شرائح البونص</h2>${table(['الشركة','المادة','من كمية','النسبة'],state.bonuses.map(b=>[b.company,b.product,b.min,b.percent+'%']))}${canManage()&&!readOnly()?`<div class="fields"><div class="field"><label>الشركة</label><input id="bCompany"></div><div class="field"><label>المادة</label><input id="bProduct"></div><div class="field"><label>من كمية</label><input id="bMin" type="number"></div><div class="field"><label>النسبة %</label><input id="bPercent" type="number"></div></div><button class="btn" onclick="addBonus()">إضافة شريحة</button>`:''}<div class="notice">البونص = تقريب للأعلى (الكمية × النسبة ÷ 100). لا يضاف إلى قيمة الطلب.</div></section></div>`}
function addOffer(){if(readOnly()||!canManage())return;const company=value('offerCompany'),title=value('offerTitle');if(!company||!title)return alert('أكمل البيانات');state.offers.push({company,title});save();render()}
function addBonus(){if(readOnly()||!canManage())return;const company=value('bCompany'),product=value('bProduct'),min=Number(value('bMin')),percent=Number(value('bPercent'));if(!company||!product||min<=0||percent<0)return alert('أكمل البيانات');state.bonuses.push({company,product,min,percent});save();render()}
function suppliers(){return `<section class="panel"><h2>المذاخر المعتمدة في هذه النسخة</h2><div class="notice">هذه قائمة جزئية فقط من أسماء المذاخر التي توفرت لنا؛ قائمة الـ42 كاملة غير موجودة في الملفات المسترجعة.</div><div class="chips">${state.suppliers.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>${canManage()&&!readOnly()?`<div class="actions"><input id="supplierName" placeholder="اسم مذخر جديد"><button class="btn" onclick="addSupplier()">إضافة مذخر</button></div>`:''}</section><section class="panel"><h2>طلبات إضافة مذخر</h2>${state.supplierRequests.map(x=>`<p>${esc(x.name)} — ${esc(x.rep)} (${esc(x.status)})</p>`).join('')||'<div class="empty">لا توجد طلبات</div>'}</section>`}
function addSupplier(){if(!canManage()||readOnly())return;const s=value('supplierName');if(!s)return;if(state.suppliers.some(x=>x.trim().toLowerCase()===s.toLowerCase()))return alert('اسم المذخر موجود');state.suppliers.push(s);save();render()}
function messages(){return `<section class="panel"><h2>المتابعة</h2>${mine(state.visits).filter(v=>v.results.some(r=>['متابعة','إعادة زيارة','موعد استحصال','المالك غير موجود'].includes(r))).map(v=>`<p>• ${esc(v.customer)} — ${esc(v.followup||v.date)} — ${esc(v.rep)}</p>`).join('')||'<div class="empty">لا توجد متابعات مطلوبة</div>'}</section><section class="panel"><h2>الدعم والمراسلات</h2>${state.messages.filter(m=>canManage()||m.from===current.name||m.to===current.name).map(m=>`<div class="panel"><b>${esc(m.from)} ← ${esc(m.to)}</b><p>${esc(m.text)}</p><small>${esc(m.date)}</small></div>`).join('')||'<div class="empty">لا توجد رسائل</div>'}${!readOnly()?`<div class="fields"><div class="field"><label>إلى</label><select id="msgTo">${state.users.filter(u=>u.id!==current.id).map(u=>`<option>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>الرسالة</label><textarea id="msgText"></textarea></div></div><button class="btn" onclick="sendMsg()">إرسال</button>`:''}</section>`}
function sendMsg(){if(readOnly())return;const text=value('msgText');if(!text)return;state.messages.push({id:id(),from:current.name,to:value('msgTo'),text,date:TODAY()});save();render()}
function evaluationBody(){const v=todayVisits().length,o=todayOrders().length,s=sales(todayOrders()),c=todayVisits().reduce((a,x)=>a+Number(x.collection||0),0),goal=state.settings.visitGoal;return `${cards([['الزيارات',v],['الطلبات',o],['المبيعات',money(s)],['الاستحصال',money(c)]])}<p><b>النشاط الميداني:</b> ${v>=goal?'ممتاز':'أقل من المعدل المرجعي'} — ${v} من ${goal} زيارات</p><div class="bar"><i style="width:${Math.min(100,v/goal*100)}%"></i></div><p><b>التوجيه:</b> ${v<8?'حاول الوصول إلى 8–10 زيارات يومياً مع التركيز على الجهات التي تحتاج متابعة.':'حافظ على مستوى النشاط الميداني وجودة الزيارات.'}</p><p><b>الطلبات:</b> ${o?'تابع تحويل الطلبات إلى تجهيز فعلي.':'ركّز على تحويل الزيارات إلى طلبات.'}</p><p><b>المبيعات:</b> ${s?'تابع المبيعات المؤكدة وفرص الزيادة.':'المبيعات المؤكدة اليوم صفر؛ تابع حالات التجهيز.'}</p><p><b>الاستحصال:</b> ${c?'استمر بمتابعة الذمم المفتوحة.':'راجع الذمم المستحقة وحدد مواعيد متابعة.'}</p>`}
function evaluation(){return `<section class="panel"><h2>التقييم والتوجيه اليومي</h2>${evaluationBody()}</section>`}
function reps(){if(!canManage())return '';return `<section class="panel"><h2>قائمة المندوبين</h2>${repTable()}<div class="line"></div>${table(['الاسم','الحالة','الصلاحية'],state.users.filter(x=>x.role==='rep').map(x=>[x.name,x.active?'نشط':'موقوف',titleRole(x.role)]))}</section>`}
function users(){if(!canManage())return '';return `<section class="panel"><h2>المستخدمون والصلاحيات</h2><div class="notice">إضافة المستخدمين وتغيير الصلاحيات الحقيقية وإعادة تعيين PIN تتطلب خادماً آمناً. هذه الواجهة للعرض ولا تنشئ حسابات Firebase.</div>${table(['الاسم','الدور','الحالة'],state.users.map(u=>[u.name,titleRole(u.role),u.active?'نشط':'موقوف']))}${isAdmin()&&!readOnly()?`<div class="actions"><button class="btn alt" onclick="alert('هذه العملية تتطلب خادماً آمناً؛ لا يمكن تنفيذها من ملف HTML مستقل')">إضافة حساب فعلي / إعادة PIN</button></div>`:''}</section>`}
const oldRender=render;render=function(){oldRender();if(current&&view==='visits')drawVisitRows();if(current&&view==='orders')drawOrders()};render();
</script></body></html>
